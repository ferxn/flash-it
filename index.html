<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Studio Sync Rig Pro - Real Camera & Flash</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #22c55e;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      padding: 12px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: var(--bg-card);
      border-radius: 16px;
      padding: 1rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    header { text-align: center; }
    header h1 { font-size: 1.3rem; color: var(--accent); }
    .subtitle { font-size: 0.75rem; color: var(--text-muted); }
    
    .connection-box {
      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }
    #qrcode { display: flex; justify-content: center; margin: 8px 0; }
    #qrcode img { border: 6px solid white; border-radius: 6px; }
    .peer-status { font-size: 0.8rem; font-weight: bold; color: var(--success); }

    .role-selector {
      display: flex; gap: 6px;
      background: var(--bg-main); padding: 4px; border-radius: 10px;
    }
    .role-btn {
      flex: 1; padding: 10px 4px; border: none; border-radius: 8px;
      background: transparent; color: var(--text-muted); font-weight: 600; font-size: 0.85rem;
      cursor: pointer; transition: all 0.2s ease;
    }
    .role-btn.active { background: var(--accent); color: var(--bg-main); }
    
    .panel { display: none; flex-direction: column; gap: 10px; }
    .panel.active { display: flex; }
    .field-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.8rem; color: var(--text-muted); }
    input[type="number"], input[type="range"] {
      width: 100%; padding: 10px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg-main); color: var(--text-primary);
    }
    .btn-action {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      font-size: 1rem; font-weight: bold; cursor: pointer; transition: transform 0.1s ease;
    }
    .btn-action.danger { background: var(--danger); color: white; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); }
    .btn-action.accent { background: var(--accent); color: var(--bg-main); }
    .btn-action:active { transform: scale(0.97); }

    /* Camera Feed Area */
    .viewfinder-container {
      position: relative;
      width: 100%;
      height: 220px;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .viewfinder-overlay {
      position: absolute;
      inset: 0;
      border: 2px dashed rgba(56, 189, 248, 0.4);
      margin: 15px;
      border-radius: 8px;
      pointer-events: none;
    }

    .gallery-preview {
      display: flex; gap: 8px; overflow-x: auto; padding: 4px 0;
    }
    .gallery-preview img {
      width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border);
    }

    .console-box {
      background: var(--bg-main); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px; font-family: monospace;
      font-size: 0.72rem; height: 90px; overflow-y: auto; color: #34d399;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>📸 Studio Sync Rig Pro</h1>
      <p class="subtitle">Hardware Interfacing: Real Camera & Flash</p>
    </header>

    <div class="connection-box">
      <div id="qr-container">
        <p style="font-size: 0.8rem; color: var(--text-muted);">ให้มือถือเครื่องอื่นสแกน QR Code เพื่อเข้าร่วม:</p>
        <div id="qrcode"></div>
      </div>
      <div class="peer-status" id="peer-status">กำลังเริ่มต้นระบบ P2P...</div>
    </div>

    <nav class="role-selector">
      <button class="role-btn active" data-role="main">🎛️ Main</button>
      <button class="role-btn" data-role="camera">📸 Camera</button>
      <button class="role-btn" data-role="flash">🔦 Flash</button>
    </nav>

    <main>
      <!-- Main Controller Panel -->
      <section id="panel-main" class="panel active">
        <div class="field-group">
          <label>จำนวนภาพที่ถ่าย (Burst Count):</label>
          <input type="number" id="burst-count" value="3" min="1" max="10">
        </div>
        <div class="field-group">
          <label>ระยะห่างแต่ละภาพ (Interval ms):</label>
          <input type="number" id="burst-interval" value="600" min="200" step="50">
        </div>
        <button id="btn-fire" class="btn-action danger">🔥 FIRE HARDWARE SYSTEM</button>
      </section>

      <!-- Real Camera Panel -->
      <section id="panel-camera" class="panel">
        <button id="btn-init-cam" class="btn-action accent">📷 เปิดใช้งานกล้องมือถือ (Init Camera)</button>
        <div class="viewfinder-container">
          <video id="webcam" autoplay playsinline muted></video>
          <div class="viewfinder-overlay"></div>
        </div>
        <div class="field-group">
          <label>Shutter Compensation Offset (ms):</label>
          <input type="range" id="cam-offset" min="0" max="250" value="60">
          <span style="color:var(--accent); font-size:0.8rem;"><strong id="cam-val">60</strong> ms</span>
        </div>
        <label>ภาพที่ถ่ายได้สะสม:</label>
        <div class="gallery-preview" id="gallery"></div>
      </section>

      <!-- Real Flash Panel -->
      <section id="panel-flash" class="panel">
        <button id="btn-init-flash" class="btn-action accent">⚡ ขอสิทธิ์เปิดแฟลชหลอดจริง (Init Flash Driver)</button>
        <div class="field-group" style="margin-top:10px;">
          <label>Torch Power On Delay (ms):</label>
          <input type="range" id="flash-offset" min="0" max="150" value="20">
          <span style="color:var(--accent); font-size:0.8rem;"><strong id="flash-val">20</strong> ms</span>
        </div>
        <div class="field-group">
          <label>Flash Duration (ms):</label>
          <input type="number" id="flash-duration" value="100" min="30" max="500">
        </div>
      </section>
    </main>

    <footer>
      <div id="log-box" class="console-box"></div>
    </footer>
  </div>

  <canvas id="hidden-canvas" style="display:none;"></canvas>

  <script>
    const logBox = document.getElementById('log-box');
    const statusEl = document.getElementById('peer-status');
    const videoEl = document.getElementById('webcam');
    const galleryEl = document.getElementById('gallery');
    const canvasEl = document.getElementById('hidden-canvas');
    
    function sysLog(msg) {
      const time = new Date().toISOString().split('T')[1].slice(0, -1);
      logBox.innerHTML += `[${time}] ${msg}<br>`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    let currentRole = 'main';
    let peer = null;
    let connections = [];
    
    // Hardware API Variables
    let videoTrack = null;
    let torchSupported = false;

    // Check URL parameters for Host/Client mode
    const urlParams = new URLSearchParams(window.location.search);
    const targetHostId = urlParams.get('host');

    if (targetHostId) {
      document.getElementById('qr-container').style.display = 'none';
      statusEl.textContent = '⚡ กำลังเชื่อมต่อไปยัง Host...';
      initClientPeer(targetHostId);
    } else {
      initHostPeer();
    }

    function initHostPeer() {
      peer = new Peer();
      peer.on('open', (id) => {
        statusEl.textContent = `🟢 เครื่องหลักพร้อมใช้งาน (Peers: 0)`;
        const connectUrl = `${window.location.origin}${window.location.pathname}?host=${id}`;
        new QRCode(document.getElementById("qrcode"), {
          text: connectUrl,
          width: 110,
          height: 110
        });
        sysLog(`Host ID Created: ${id}`);
      });

      peer.on('connection', (conn) => {
        connections.push(conn);
        statusEl.textContent = `🟢 เชื่อมต่อแล้ว (${connections.length} เครื่อง)`;
        sysLog(`📱 อุปกรณ์ใหม่เชื่อมต่อเข้ามา!`);
        conn.on('data', (data) => handleIncomingMessage(data));
        conn.on('close', () => {
          connections = connections.filter(c => c !== conn);
          statusEl.textContent = `🟢 เชื่อมต่อแล้ว (${connections.length} เครื่อง)`;
        });
      });
    }

    function initClientPeer(hostId) {
      peer = new Peer();
      peer.on('open', () => {
        const conn = peer.connect(hostId);
        connections.push(conn);
        conn.on('open', () => {
          statusEl.textContent = '🟢 เชื่อมต่อกับเครื่อง Host สำเร็จ!';
          sysLog('Connected to Host!');
        });
        conn.on('data', (data) => handleIncomingMessage(data));
      });
    }

    function broadcastPayload(payload) {
      connections.forEach(conn => {
        if (conn.open) conn.send(payload);
      });
    }

    // Role Switching
    document.querySelectorAll('.role-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

        e.target.classList.add('active');
        currentRole = e.target.dataset.role;
        document.getElementById(`panel-${currentRole}`).classList.add('active');
        sysLog(`Role Switched -> ${currentRole.toUpperCase()}`);
      });
    });

    document.getElementById('cam-offset').addEventListener('input', (e) => {
      document.getElementById('cam-val').textContent = e.target.value;
    });
    document.getElementById('flash-offset').addEventListener('input', (e) => {
      document.getElementById('flash-val').textContent = e.target.value;
    });

    // --- HARDWARE 1: REAL CAMERA INITIALIZATION ---
    document.getElementById('btn-init-cam').addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
        }).catch(async () => {
          return await navigator.mediaDevices.getUserMedia({ video: true });
        });

        videoEl.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];
        sysLog('📷 กล้องหลังพร้อมใช้งาน!');
      } catch (err) {
        sysLog(`❌ ไม่สามารถเข้าถึงกล้องได้: ${err.message}`);
      }
    });

    // --- HARDWARE 2: REAL HARDWARE FLASH (TORCH) INITIALIZATION ---
    document.getElementById('btn-init-flash').addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } }
        });
        videoTrack = stream.getVideoTracks()[0];
        const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};

        if (capabilities.torch) {
          torchSupported = true;
          sysLog('⚡ ตรวจพบแฟลชหลอดจริง (Hardware Torch Ready)!');
        } else {
          torchSupported = false;
          sysLog('⚠️ อุปกรณ์ไม่รองรับ Torch API หรือใช้กล้องหน้า (ระบบจะใช้วาบหน้าจอแทน)');
        }
      } catch (err) {
        sysLog(`❌ เปิดใช้งานแฟลชล้มเหลว: ${err.message}`);
      }
    });

    // --- TRIGGER EXECUTION ---
    document.getElementById('btn-fire').addEventListener('click', () => {
      if (currentRole !== 'main') return;
      const count = parseInt(document.getElementById('burst-count').value);
      const interval = parseInt(document.getElementById('burst-interval').value);
      const startMasterTime = performance.now() + 350;

      const payload = {
        type: 'BURST_COMMAND',
        startTime: startMasterTime,
        count: count,
        interval: interval
      };

      broadcastPayload(payload);
      handleIncomingMessage(payload);
      sysLog(`[MAIN] ยิงคำสั่งฮาร์ดแวร์ไป ${connections.length} เครื่อง!`);
    });

    function handleIncomingMessage(data) {
      if (data.type !== 'BURST_COMMAND') return;

      sysLog(`[${currentRole.toUpperCase()}] สั่งงานฮาร์ดแวร์ ${data.count} รอบ`);

      const offset = currentRole === 'camera' 
        ? parseInt(document.getElementById('cam-offset').value)
        : parseInt(document.getElementById('flash-offset').value);

      for (let i = 0; i < data.count; i++) {
        const targetTime = data.startTime + (i * data.interval);
        const actualTriggerTime = targetTime - offset;
        const delay = actualTriggerTime - performance.now();

        if (delay > 0) {
          setTimeout(() => {
            if (currentRole === 'camera') {
              captureRealPhoto(i + 1);
            } else if (currentRole === 'flash') {
              triggerRealHardwareFlash(i + 1);
            }
          }, delay);
        }
      }
    }

    // Capture Real Photo from Video Stream
    function captureRealPhoto(shotNum) {
      if (!videoEl.srcObject) {
        sysLog(`📸 [CAM #${shotNum}] ยังไม่ได้เปิดกล้อง!`);
        return;
      }
      canvasEl.width = videoEl.videoWidth || 640;
      canvasEl.height = videoEl.videoHeight || 480;
      const ctx = canvasEl.getContext('2d');
      ctx.drawImage(videoEl, 0, 0, canvasEl.width, canvasEl.height);
      
      const imgUrl = canvasEl.toDataURL('image/jpeg', 0.85);
      const img = document.createElement('img');
      img.src = imgUrl;
      galleryEl.prepend(img);

      sysLog(`📸 [CAM] ถ่ายภาพจริงสำเร็จ #${shotNum}`);
    }

    // Trigger Real Hardware Flash Light
    async function triggerRealHardwareFlash(shotNum) {
      const flashDuration = parseInt(document.getElementById('flash-duration').value) || 100;

      if (videoTrack && torchSupported) {
        try {
          // Hardware Flash LED On
          await videoTrack.applyConstraints({ advanced: [{ torch: true }] });
          sysLog(`⚡ [FLASH] ไฟแฟลชหลอดจริงเปิดแล้ว #${shotNum}`);

          setTimeout(async () => {
            // Hardware Flash LED Off
            await videoTrack.applyConstraints({ advanced: [{ torch: false }] });
          }, flashDuration);
        } catch (e) {
          sysLog(`⚡ Flash Error: ${e.message}`);
        }
      } else {
        // Fallback Screen Flash
        const overlay = document.createElement('div');
        overlay.style.position = 'fixed';
        overlay.style.inset = '0';
        overlay.style.background = 'white';
        overlay.style.zIndex = '99999';
        document.body.appendChild(overlay);
        sysLog(`⚡ [FLASH] หน้าจอสว่างวาบแทนแฟลช #${shotNum}`);

        setTimeout(() => {
          overlay.remove();
        }, flashDuration);
      }
    }

    sysLog('Hardware Control Engine Ready.');
  </script>
</body>
</html>
